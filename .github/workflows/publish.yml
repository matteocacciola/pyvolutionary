name: Publish to PyPI

# Publishes the release on PyPI when a version tag (e.g. v2.6.6) is pushed. The upload uses the API token stored in the
# repository secret PYPI_TOKEN.
#
# To release: bump the version in pyproject.toml (and CITATION.cff), merge it into main, then tag that commit:
#   git tag v2.6.6 && git push origin v2.6.6

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Refuse to publish a version that does not match the tag
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]["version"])')"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "pyproject.toml says $VERSION but the tag is $TAG"; exit 1
          fi

      - name: Run the tests before publishing
        run: |
          python -m pip install --upgrade . pytest requests-mock
          python -m pytest -p no:warnings -q tests

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Software bill of materials
        # Written OUTSIDE dist/: the publish step uploads everything in dist/ to PyPI, and a .json is not a distribution.
        run: |
          python -m pip install cyclonedx-bom
          python -m pip install dist/*.whl
          mkdir -p sbom
          cyclonedx-py environment --output-format JSON --output-file sbom/sbom.cyclonedx.json

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the GitHub release and attach the distributions and the SBOM
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: sbom/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist/
          verbose: true

      - name: Create the GitHub release
        # No checkout in this job, so gh needs to be told the repository.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" -R "$REPO" --generate-notes --verify-tag || true
          gh release upload "$TAG" -R "$REPO" dist/* sbom/sbom.cyclonedx.json --clobber
